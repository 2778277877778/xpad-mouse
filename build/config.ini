CONFIG_SPEED_CHANGE = 0x0300    # LB+RB = 循环切换速度
# 第一项为当前使用的灵敏度
CURSOR_SPEED = 当前=0.0585
DEAD_ZONE = 6000
SCROLL_DEAD_ZONE = 5000
SCROLL_SPEED = 0.1
ACCELERATION_FACTOR = 0.00
SWAP_THUMBSTICKS = 0
